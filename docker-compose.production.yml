name: metric-control-center-production
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metric_control}
      POSTGRES_USER: ${POSTGRES_USER:-metric_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
    - postgres_password
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - data
  migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    init: true
    restart: 'no'
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
    command:
    - alembic
    - upgrade
    - head
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-metric_control}
      POSTGRES_USER: ${POSTGRES_USER:-metric_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      WORKSPACE_ID: ${WORKSPACE_ID:-default}
      LOCAL_READ_ONLY: 'true'
      ACTIONS_ENABLED: 'false'
      AI_ENABLED: 'false'
      AI_AUTOPILOT_ALLOWED: 'false'
      TELEGRAM_ENABLED: 'false'
      APP_ENV: production
    secrets:
    - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    image: mcc-backend:${MCC_IMAGE_TAG:-local}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - data
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-metric_control}
      POSTGRES_USER: ${POSTGRES_USER:-metric_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      WORKSPACE_ID: ${WORKSPACE_ID:-default}
      LOCAL_READ_ONLY: 'true'
      CELERY_BROKER_URL: redis://redis:6379/0
      SYNC_ENABLED: 'true'
      METRICFLOW_SCHEMA_FILE: /config/metricflow-schema.json
      ACTIONS_ENABLED: 'false'
      SYNC_DAILY_BUDGET: '800'
      AUTH_ENABLED: 'true'
      APP_ENV: production
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}
      SESSION_SECRET_FILE: /run/secrets/session_secret
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      AUTH_TRUST_PROXY: 'true'
      SYNC_TIMEZONE: ${SYNC_TIMEZONE:-Europe/Moscow}
      AI_ENABLED: 'false'
      AI_AUTOPILOT_ALLOWED: 'false'
      TELEGRAM_ENABLED: 'false'
      PROVIDER_ENCRYPTION_KEY_FILE: /run/secrets/provider_encryption_key
      METRICFLOW_READ_KEY_FILE: /run/secrets/metricflow_read_key
      META_DAILY_BUDGET: ${META_DAILY_BUDGET:-5000}
    secrets:
    - postgres_password
    - session_secret
    - provider_encryption_key
    - metricflow_read_key
    volumes:
    - ./config:/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready',
        timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
    command:
    - uvicorn
    - backend.app:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --no-access-log
    image: mcc-backend:${MCC_IMAGE_TAG:-local}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - app
    - data
  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
    command:
    - python
    - -m
    - workers.runtime
    - worker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-metric_control}
      POSTGRES_USER: ${POSTGRES_USER:-metric_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      WORKSPACE_ID: ${WORKSPACE_ID:-default}
      LOCAL_READ_ONLY: 'true'
      CELERY_BROKER_URL: redis://redis:6379/0
      METRICFLOW_READ_KEY_FILE: /run/secrets/metricflow_read_key
      METRICFLOW_SCHEMA_FILE: /config/metricflow-schema.json
      ACTIONS_ENABLED: 'false'
      SYNC_ENABLED: 'true'
      SYNC_DAILY_BUDGET: '800'
      SYNC_TIMEZONE: ${SYNC_TIMEZONE:-Europe/Moscow}
      AI_ENABLED: 'false'
      AI_AUTOPILOT_ALLOWED: 'false'
      TELEGRAM_ENABLED: 'false'
      APP_ENV: production
      PROVIDER_ENCRYPTION_KEY_FILE: /run/secrets/provider_encryption_key
      META_DAILY_BUDGET: ${META_DAILY_BUDGET:-5000}
    secrets:
    - metricflow_read_key
    - postgres_password
    - provider_encryption_key
    volumes:
    - ./config:/config:ro
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    image: mcc-backend:${MCC_IMAGE_TAG:-local}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - data
    - egress
  scheduler:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
    command:
    - python
    - -m
    - workers.runtime
    - scheduler
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      LOCAL_READ_ONLY: 'true'
      SYNC_TIMEZONE: ${SYNC_TIMEZONE:-Europe/Moscow}
      ACTIONS_ENABLED: 'false'
      AI_ENABLED: 'false'
      AI_AUTOPILOT_ALLOWED: 'false'
      TELEGRAM_ENABLED: 'false'
      APP_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    image: mcc-backend:${MCC_IMAGE_TAG:-local}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - data
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_REPORTING_TIMEZONE: ${SYNC_TIMEZONE:-Europe/Moscow}
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    image: mcc-frontend:${MCC_IMAGE_TAG:-local}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - app
    - web
    init: true
    read_only: true
    tmpfs:
    - /tmp
    - /app/.next/cache
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
    - 80:80
    - 443:443
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-0}
    volumes:
    - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
    networks:
    - web
    depends_on:
      frontend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  backup:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    profiles:
    - maintenance
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-metric_control}
      POSTGRES_USER: ${POSTGRES_USER:-metric_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    secrets:
    - postgres_password
    volumes:
    - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    command:
    - backup
    networks:
    - data
    image: mcc-backup:${MCC_IMAGE_TAG:-local}
  backup-job:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-metric_control}
      POSTGRES_USER: ${POSTGRES_USER:-metric_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    secrets:
    - postgres_password
    volumes:
    - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    command:
    - job
    networks:
    - data
    image: mcc-backup:${MCC_IMAGE_TAG:-local}
    restart: unless-stopped
secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  metricflow_read_key:
    file: ./.secrets/metricflow_read_key
  session_secret:
    file: ./.secrets/session_secret
  provider_encryption_key:
    file: ./.secrets/provider_encryption_key
volumes:
  postgres_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
networks:
  app:
    internal: true
  data:
    internal: true
  web: {}
  egress: {}
