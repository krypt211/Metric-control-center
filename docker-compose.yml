name: metric-control-center
x-python-service:
  build: &id001
    context: .
    dockerfile: docker/backend.Dockerfile
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: &id002
  - /tmp
  security_opt: &id003
  - no-new-privileges:true
x-database-env:
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB:-metric_control}
  POSTGRES_USER: ${POSTGRES_USER:-metric_control}
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  WORKSPACE_ID: ${WORKSPACE_ID:-default}
  LOCAL_READ_ONLY: ${LOCAL_READ_ONLY:-false}
services:
  backend:
    build: *id001
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: *id002
    security_opt: *id003
    ports:
    - 127.0.0.1:${BACKEND_PORT:-8000}:8000
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-metric_control}
      POSTGRES_USER: ${POSTGRES_USER:-metric_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      WORKSPACE_ID: ${WORKSPACE_ID:-default}
      LOCAL_READ_ONLY: ${LOCAL_READ_ONLY:-false}
      CELERY_BROKER_URL: redis://redis:6379/0
      SYNC_ENABLED: ${SYNC_ENABLED:-false}
      METRICFLOW_SCHEMA_FILE: /config/metricflow-schema.json
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      AI_AUTOPILOT_ALLOWED: ${AI_AUTOPILOT_ALLOWED:-false}
      ACTIONS_ENABLED: ${ACTIONS_ENABLED:-false}
      ACTION_BUDGET_CONTRACT_FILE: /config/action-budget-contract.json
      ACTION_MAX_BUDGET: ${ACTION_MAX_BUDGET:-10000}
      ACTION_MAX_CHANGE_PERCENT: ${ACTION_MAX_CHANGE_PERCENT:-20}
      SYNC_DAILY_BUDGET: ${SYNC_DAILY_BUDGET:-800}
      AUTH_ENABLED: 'true'
      APP_ENV: development
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      SESSION_SECRET_FILE: /run/secrets/session_secret
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      AUTH_TRUST_PROXY: 'true'
      SYNC_TIMEZONE: ${SYNC_TIMEZONE:-Europe/Moscow}
      PROVIDER_ENCRYPTION_KEY_FILE: /run/secrets/provider_encryption_key
      METRICFLOW_READ_KEY_FILE: /run/secrets/metricflow_read_key
      META_DAILY_BUDGET: ${META_DAILY_BUDGET:-5000}
    secrets:
    - postgres_password
    - session_secret
    - provider_encryption_key
    - metricflow_read_key
    volumes:
    - ./config:/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready',
        timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
    command:
    - uvicorn
    - backend.app:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --no-access-log
  worker:
    build: *id001
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: *id002
    security_opt: *id003
    command:
    - python
    - -m
    - workers.runtime
    - worker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-metric_control}
      POSTGRES_USER: ${POSTGRES_USER:-metric_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      WORKSPACE_ID: ${WORKSPACE_ID:-default}
      LOCAL_READ_ONLY: 'true'
      CELERY_BROKER_URL: redis://redis:6379/0
      METRICFLOW_READ_KEY_FILE: /run/secrets/metricflow_read_key
      METRICFLOW_SCHEMA_FILE: /config/metricflow-schema.json
      METRICFLOW_BREAKDOWN_SCHEMA_FILE: /config/metricflow-breakdown-schema.json
      METRICFLOW_FREQUENCY_SCHEMA_FILE: /config/metricflow-frequency-schema.json
      ACTIONS_ENABLED: 'false'
      ACTION_BUDGET_CONTRACT_FILE: /config/action-budget-contract.json
      ACTION_MAX_BUDGET: ${ACTION_MAX_BUDGET:-10000}
      ACTION_MAX_CHANGE_PERCENT: ${ACTION_MAX_CHANGE_PERCENT:-20}
      SYNC_ENABLED: ${SYNC_ENABLED:-false}
      SYNC_DAILY_BUDGET: ${SYNC_DAILY_BUDGET:-800}
      SYNC_TIMEZONE: ${SYNC_TIMEZONE:-Europe/Moscow}
      PROVIDER_ENCRYPTION_KEY_FILE: /run/secrets/provider_encryption_key
      META_DAILY_BUDGET: ${META_DAILY_BUDGET:-5000}
    secrets:
    - metricflow_read_key
    - postgres_password
    - provider_encryption_key
    volumes:
    - ./config:/config:ro
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  migrate:
    build: *id001
    init: true
    restart: 'no'
    read_only: true
    tmpfs: *id002
    security_opt: *id003
    command:
    - alembic
    - upgrade
    - head
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-metric_control}
      POSTGRES_USER: ${POSTGRES_USER:-metric_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      WORKSPACE_ID: ${WORKSPACE_ID:-default}
      LOCAL_READ_ONLY: ${LOCAL_READ_ONLY:-false}
    secrets:
    - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
  scheduler:
    build: *id001
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: *id002
    security_opt: *id003
    command:
    - python
    - -m
    - workers.runtime
    - scheduler
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      LOCAL_READ_ONLY: 'true'
      SYNC_TIMEZONE: ${SYNC_TIMEZONE:-Europe/Moscow}
      ACTIONS_ENABLED: 'false'
      AI_ENABLED: ${AI_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
  action-worker:
    build: *id001
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: *id002
    security_opt: *id003
    profiles:
    - actions
    command:
    - celery
    - -A
    - workers.actions:app
    - worker
    - -Q
    - actions
    - --loglevel=INFO
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-metric_control}
      POSTGRES_USER: ${POSTGRES_USER:-metric_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      WORKSPACE_ID: ${WORKSPACE_ID:-default}
      LOCAL_READ_ONLY: ${LOCAL_READ_ONLY:-false}
      CELERY_BROKER_URL: redis://redis:6379/0
      METRICFLOW_WRITE_KEY_FILE: /run/secrets/metricflow_write_key
      ACTIONS_ENABLED: ${ACTIONS_ENABLED:-false}
      AI_AUTOPILOT_ALLOWED: ${AI_AUTOPILOT_ALLOWED:-false}
      ACTION_BUDGET_CONTRACT_FILE: /config/action-budget-contract.json
      ACTION_MAX_BUDGET: ${ACTION_MAX_BUDGET:-10000}
      ACTION_MAX_CHANGE_PERCENT: ${ACTION_MAX_CHANGE_PERCENT:-20}
      SYNC_DAILY_BUDGET: ${SYNC_DAILY_BUDGET:-800}
    secrets:
    - metricflow_write_key
    - postgres_password
    volumes:
    - ./config:/config:ro
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  ai-worker:
    build: *id001
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: *id002
    security_opt: *id003
    profiles:
    - ai
    command:
    - celery
    - -A
    - workers.ai:app
    - worker
    - -Q
    - ai
    - --concurrency=1
    - --loglevel=INFO
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-metric_control}
      POSTGRES_USER: ${POSTGRES_USER:-metric_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      WORKSPACE_ID: ${WORKSPACE_ID:-default}
      LOCAL_READ_ONLY: ${LOCAL_READ_ONLY:-false}
      CELERY_BROKER_URL: redis://redis:6379/0
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      AI_AUTOPILOT_ALLOWED: ${AI_AUTOPILOT_ALLOWED:-false}
      ACTIONS_ENABLED: ${ACTIONS_ENABLED:-false}
      ACTION_BUDGET_CONTRACT_FILE: /config/action-budget-contract.json
      ACTION_MAX_BUDGET: ${ACTION_MAX_BUDGET:-10000}
      ACTION_MAX_CHANGE_PERCENT: ${ACTION_MAX_CHANGE_PERCENT:-20}
      SYNC_DAILY_BUDGET: ${SYNC_DAILY_BUDGET:-800}
    secrets:
    - postgres_password
    - openai_api_key
    volumes:
    - ./config:/config:ro
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  telegram-bot:
    build: *id001
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: *id002
    security_opt: *id003
    profiles:
    - telegram
    command:
    - python
    - -m
    - services.telegram.bot
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-metric_control}
      POSTGRES_USER: ${POSTGRES_USER:-metric_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      WORKSPACE_ID: ${WORKSPACE_ID:-default}
      LOCAL_READ_ONLY: ${LOCAL_READ_ONLY:-false}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      AI_ENABLED: ${AI_ENABLED:-false}
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_BINDINGS_FILE: /config/telegram-bindings.json
      ACTIONS_ENABLED: ${ACTIONS_ENABLED:-false}
      ACTION_BUDGET_CONTRACT_FILE: /config/action-budget-contract.json
      ACTION_MAX_BUDGET: ${ACTION_MAX_BUDGET:-10000}
      ACTION_MAX_CHANGE_PERCENT: ${ACTION_MAX_CHANGE_PERCENT:-20}
      SYNC_DAILY_BUDGET: ${SYNC_DAILY_BUDGET:-800}
    secrets:
    - postgres_password
    - telegram_bot_token
    volumes:
    - ./config:/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    profiles:
    - web
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_REPORTING_TIMEZONE: ${SYNC_TIMEZONE:-Europe/Moscow}
    restart: unless-stopped
    ports:
    - 127.0.0.1:${FRONTEND_PORT:-3000}:3000
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metric_control}
      POSTGRES_USER: ${POSTGRES_USER:-metric_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
    - postgres_password
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 5
  backup:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    profiles:
    - maintenance
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-metric_control}
      POSTGRES_USER: ${POSTGRES_USER:-metric_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    secrets:
    - postgres_password
    volumes:
    - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    command:
    - backup
secrets:
  metricflow_read_key:
    file: ./.secrets/metricflow_read_key
  metricflow_write_key:
    file: ./.secrets/metricflow_write_key
  postgres_password:
    file: ./.secrets/postgres_password
  action_api_token:
    file: ./.secrets/action_api_token
  openai_api_key:
    file: ./.secrets/openai_api_key
  telegram_bot_token:
    file: ./.secrets/telegram_bot_token
  session_secret:
    file: ./.secrets/session_secret
  provider_encryption_key:
    file: ./.secrets/provider_encryption_key
volumes:
  postgres_data: null
  redis_data: null
