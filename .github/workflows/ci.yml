name: READ-only checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mcc_ci
          POSTGRES_USER: mcc_ci
          POSTGRES_PASSWORD: ci-fixture-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U mcc_ci" --health-interval 5s --health-retries 10
    env:
      PYTHONPATH: tests
      TEST_POSTGRES_URL: postgresql+psycopg://mcc_ci:ci-fixture-only@localhost/mcc_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock && pip install --no-deps -e '.[workers,test]' && pip install 'pytest>=8,<10'
      - run: python -m pytest -q tests
      - run: DATABASE_URL="$TEST_POSTGRES_URL" alembic check
      - run: python scripts/security_scan.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:unit
